services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_integrity
      POSTGRES_USER: ai_integrity
      POSTGRES_PASSWORD: ai_integrity
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_integrity -d ai_integrity"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://ai_integrity:ai_integrity@db:5432/ai_integrity
      DEBUG_SYNC_TOOLS_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
